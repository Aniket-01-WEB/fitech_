name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only; nothing here talks to a real service.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend — types
        run: npm run typecheck -w backend
      - name: Backend — unit tests
        run: npm test -w backend
      - name: Frontend — lint
        run: npm run lint -w frontend
      - name: Frontend — types
        run: npm run typecheck -w frontend
      - name: Frontend — production build
        run: npm run build -w frontend
      - name: Frontend — E2E (no backend required)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w frontend
        env:
          CI: true
