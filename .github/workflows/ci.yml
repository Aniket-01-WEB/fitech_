name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Same project as .env so the production build (and its CSP
      # connect-src) matches what is deployed. The anon key is the public
      # publishable key, read from the repository secret the keepalive
      # workflow already uses.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://cpainkjljrjjwzdgdewz.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_API_URL: https://fitech-02.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend — types
        run: npm run typecheck -w backend
      - name: Backend — unit tests
        run: npm test -w backend
      - name: Frontend — lint
        run: npm run lint -w frontend
      - name: Frontend — types
        run: npm run typecheck -w frontend
      - name: Frontend — production build
        run: npm run build -w frontend
      - name: Frontend — E2E (no backend required)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w frontend
        env:
          CI: true
