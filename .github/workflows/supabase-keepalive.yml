name: Supabase keepalive

# Supabase pauses a free-tier project after 7 days of inactivity. This
# runs every 5 days regardless of whether anyone's backend/dev server is
# actually running — GitHub's own infrastructure fires it, not ours —
# and makes one real, RLS-respecting read against the database so
# Supabase counts it as activity and never pauses.
on:
  schedule:
    - cron: '0 6 */5 * *' # every 5 days at 06:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
